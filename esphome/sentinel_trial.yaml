    type: int
    restore_value: yes
    initial_value: '0'
  - id: status_pixel_auto_enabled
    type: bool
    restore_value: yes
    initial_value: 'true'
  - id: status_pixel_step
    type: int
    restore_value: no
    initial_value: '0'
  - id: wifi_connected_state
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: wifi_disconnect_count
    type: int
    restore_value: yes
    initial_value: '0'
  - id: api_client_count
    type: int
    restore_value: no
    initial_value: '0'
  - id: api_disconnect_count
    type: int
    restore_value: yes
    initial_value: '0'
  - id: pir_enabled
    type: bool
    restore_value: yes
    initial_value: 'true'
  - id: sound_enabled
    type: bool
    restore_value: yes
    initial_value: 'true'
  - id: smoke_alarm_enabled
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: pir_high_since_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: pir_low_since_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: pir_hold_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: pir_warmup_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: pir_motion_state
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: sound_window_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: sound_min_sample
    type: int
    restore_value: no
    initial_value: '4095'
  - id: sound_max_sample
    type: int
    restore_value: no
    initial_value: '0'
  - id: sound_peak_to_peak_adc_raw
    type: int
    restore_value: no
    initial_value: '0'
  - id: sound_hold_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: sound_intrusion_state
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: sound_calibration_mode
    type: int
    restore_value: no
    initial_value: '0'
  - id: sound_calibration_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: sound_calibration_peak
    type: int
    restore_value: no
    initial_value: '0'
  - id: smoke_alarm_state
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: smoke_alarm_tone_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: smoke_alarm_last_beep_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: smoke_alarm_hold_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: smoke_alarm_beep_count
    type: int
    restore_value: no
    initial_value: '0'

script:
  - id: reset_runtime_states
    then:
      - lambda: |-
          id(pir_high_since_ms) = 0;
          id(pir_low_since_ms) = 0;
          id(pir_hold_until_ms) = 0;
          id(pir_motion_state) = false;
          id(sound_window_start_ms) = 0;
          id(sound_min_sample) = 4095;
          id(sound_max_sample) = 0;
          id(sound_peak_to_peak_adc_raw) = 0;
          id(sound_hold_until_ms) = 0;
          id(sound_intrusion_state) = false;
          id(sound_calibration_mode) = 0;
          id(sound_calibration_until_ms) = 0;
          id(sound_calibration_peak) = 0;
          id(smoke_alarm_state) = false;
          id(smoke_alarm_tone_active) = false;
          id(smoke_alarm_last_beep_ms) = 0;
          id(smoke_alarm_hold_until_ms) = 0;
          id(smoke_alarm_beep_count) = 0;
      - binary_sensor.template.publish:
          id: pir_motion
          state: false
      - binary_sensor.template.publish:
          id: sound_intrusion
          state: false
      - binary_sensor.template.publish:
          id: smoke_alarm_detected
          state: false
      - sensor.template.publish:
          id: sound_peak_adc
          state: 0
      - sensor.template.publish:
          id: sound_min_adc
          state: 0
      - sensor.template.publish:
          id: sound_max_adc
          state: 0
      - sensor.template.publish:
          id: smoke_alarm_tone_score
          state: 0

