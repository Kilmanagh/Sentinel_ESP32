# Trial ESPHome port of the Sentinel node.
#
# Keeps what ESPHome is good at:
# - Wi-Fi + native API/Home Assistant integration
# - BME280 environment telemetry
# - PIR motion, reed switch door, and MAX9814 sound detection
# - Runtime tuning through Home Assistant number entities
#
# Leaves out on purpose:
# - Custom MQTT topic/discovery model
# - Custom serial cfg command interface

substitutions:
  device_name: sentinel-trial
  friendly_name: Sentinel Trial
  fallback_ap_password: change-me-1234

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: Trial ESPHome conversion of the Sentinel ESP32 node
  project:
    name: sentinel.trial
    version: "0.1"
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(pir_warmup_until_ms) = millis() + (uint32_t) id(pir_warmup_ms).state;

esp32:
  board: esp32dev
  framework:
    type: arduino

preferences:
  flash_write_interval: 1min

logger:
  level: INFO

api:

ota:

web_server:
  port: 80
  version: 3
  include_internal: false

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Uncomment and edit if you want a fixed LAN address.
  # manual_ip:
  #   static_ip: 192.168.1.50
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0
  #   dns1: 192.168.1.1
  #   dns2: 1.1.1.1
  ap:
    ssid: ${friendly_name} Fallback
    password: ${fallback_ap_password}

captive_portal:

status_led:
  pin:
    number: 2

i2c:
  sda: 21
  scl: 22
  scan: true

globals:
  - id: pir_enabled
    type: bool
    restore_value: yes
    initial_value: 'true'
  - id: sound_enabled
    type: bool
    restore_value: yes
    initial_value: 'true'
  - id: pir_high_since_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: pir_low_since_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: pir_hold_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: pir_warmup_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: pir_motion_state
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: sound_window_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: sound_min_sample
    type: int
    restore_value: no
    initial_value: '4095'
  - id: sound_max_sample
    type: int
    restore_value: no
    initial_value: '0'
  - id: sound_peak_to_peak_adc_raw
    type: int
    restore_value: no
    initial_value: '0'
  - id: sound_hold_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: sound_intrusion_state
    type: bool
    restore_value: no
    initial_value: 'false'

number:
  - platform: template
    name: PIR Warmup
    id: pir_warmup_ms
    unit_of_measurement: ms
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 30000
    min_value: 0
    max_value: 120000
    step: 1000
    mode: box

  - platform: template
    name: PIR Detect Stable
    id: pir_detect_stable_ms
    unit_of_measurement: ms
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 150
    min_value: 0
    max_value: 5000
    step: 10
    mode: box

  - platform: template
    name: PIR Clear Stable
    id: pir_clear_stable_ms
    unit_of_measurement: ms
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 1500
    min_value: 0
    max_value: 10000
    step: 50
    mode: box

  - platform: template
    name: PIR Hold
    id: pir_hold_ms
    unit_of_measurement: ms
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 5000
    min_value: 0
    max_value: 20000
    step: 100
    mode: box

  - platform: template
    name: Sound Sample Window
    id: sound_sample_window_ms
    unit_of_measurement: ms
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 100
    min_value: 20
    max_value: 1000
    step: 10
    mode: box

  - platform: template
    name: Sound Hold
    id: sound_hold_ms
    unit_of_measurement: ms
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 3000
    min_value: 0
    max_value: 15000
    step: 100
    mode: box

  - platform: template
    name: Sound Threshold ADC
    id: sound_threshold_adc
    unit_of_measurement: adc
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 1200
    min_value: 0
    max_value: 4095
    step: 10
    mode: box

  - platform: template
    name: Sound Level Floor ADC
    id: sound_level_floor_adc
    unit_of_measurement: adc
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 60
    min_value: 0
    max_value: 4095
    step: 5
    mode: box

  - platform: template
    name: Sound Level Ceiling ADC
    id: sound_level_ceiling_adc
    unit_of_measurement: adc
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 1800
    min_value: 1
    max_value: 4095
    step: 5
    mode: box

  - platform: template
    name: Sound dB Floor
    id: sound_db_floor
    unit_of_measurement: dB
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 35
    min_value: 0
    max_value: 120
    step: 1
    mode: box

  - platform: template
    name: Sound dB Ceiling
    id: sound_db_ceiling
    unit_of_measurement: dB
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 90
    min_value: 1
    max_value: 140
    step: 1
    mode: box

switch:
  - platform: template
    name: Enable PIR
    id: pir_enable_switch
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          id(pir_enabled) = true;
          id(pir_warmup_until_ms) = millis() + (uint32_t) id(pir_warmup_ms).state;
    turn_off_action:
      - lambda: |-
          id(pir_enabled) = false;
          id(pir_motion_state) = false;
          id(pir_high_since_ms) = 0;
          id(pir_low_since_ms) = 0;
          id(pir_hold_until_ms) = 0;
          id(pir_motion).publish_state(false);

  - platform: template
    name: Enable Sound
    id: sound_enable_switch
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          id(sound_enabled) = true;
          id(sound_window_start_ms) = 0;
    turn_off_action:
      - lambda: |-
          id(sound_enabled) = false;
          id(sound_intrusion_state) = false;
          id(sound_window_start_ms) = 0;
          id(sound_hold_until_ms) = 0;
          id(sound_peak_to_peak_adc_raw) = 0;
          id(sound_intrusion).publish_state(false);
          id(sound_peak_adc).publish_state(0);
          id(sound_min_adc).publish_state(0);
          id(sound_max_adc).publish_state(0);

sensor:
  - platform: bme280_i2c
    address: 0x76
    update_interval: 30s
    temperature:
      name: Temperature
      id: bme_temperature_f
      unit_of_measurement: "°F"
      device_class: temperature
      state_class: measurement
      filters:
        - lambda: return x * 9.0f / 5.0f + 32.0f;
    pressure:
      name: Pressure
      id: bme_pressure_hpa
      unit_of_measurement: hPa
      device_class: atmospheric_pressure
      state_class: measurement
    humidity:
      name: Humidity
      id: bme_humidity
      device_class: humidity
      state_class: measurement

  - platform: template
    name: Comfort Index
    id: comfort_index
    icon: mdi:thermometer-check
    accuracy_decimals: 1
    state_class: measurement
    update_interval: 30s
    lambda: |-
      const float temp_f = id(bme_temperature_f).state;
      const float humidity = id(bme_humidity).state;
      if (isnan(temp_f) || isnan(humidity)) {
        return NAN;
      }

      float temp_score;
      if (temp_f >= 70.0f && temp_f <= 76.0f) {
        temp_score = 100.0f;
      } else if (temp_f < 70.0f) {
        temp_score = std::max(0.0f, 100.0f - (70.0f - temp_f) * 5.0f);
      } else {
        temp_score = std::max(0.0f, 100.0f - (temp_f - 76.0f) * 5.0f);
      }

      float humidity_score;
      if (humidity >= 35.0f && humidity <= 55.0f) {
        humidity_score = 100.0f;
      } else if (humidity < 35.0f) {
        humidity_score = std::max(0.0f, 100.0f - (35.0f - humidity) * 3.0f);
      } else {
        humidity_score = std::max(0.0f, 100.0f - (humidity - 55.0f) * 3.0f);
      }

      return (temp_score * 0.6f) + (humidity_score * 0.4f);

  - platform: template
    name: IAQ Score
    id: iaq_score
    icon: mdi:air-filter
    accuracy_decimals: 0
    state_class: measurement
    update_interval: 30s
    lambda: |-
      const float humidity = id(bme_humidity).state;
      const float pressure_hpa = id(bme_pressure_hpa).state;
      if (isnan(humidity) || isnan(pressure_hpa)) {
        return NAN;
      }

      int humidity_score;
      if (humidity >= 40.0f && humidity <= 60.0f) {
        humidity_score = 100;
      } else if (humidity < 40.0f) {
        humidity_score = std::max(0, (int) (100.0f - (40.0f - humidity) * 3.0f));
      } else {
        humidity_score = std::max(0, (int) (100.0f - (humidity - 60.0f) * 3.5f));
      }

      int pressure_score;
      if (pressure_hpa >= 1005.0f && pressure_hpa <= 1025.0f) {
        pressure_score = 100;
      } else if (pressure_hpa < 1005.0f) {
        pressure_score = std::max(0, (int) (100.0f - (1005.0f - pressure_hpa) * 2.0f));
      } else {
        pressure_score = std::max(0, (int) (100.0f - (pressure_hpa - 1025.0f) * 2.0f));
      }

      return (float) ((humidity_score * 70 + pressure_score * 30) / 100);

  - platform: wifi_signal
    name: WiFi RSSI
    update_interval: 60s

  - platform: uptime
    name: Uptime
    update_interval: 60s

  - platform: template
    name: Sound Peak ADC
    id: sound_peak_adc
    unit_of_measurement: adc
    accuracy_decimals: 0
    state_class: measurement
    filters:
      - throttle: 1s
    update_interval: never

  - platform: template
    name: Sound Min ADC
    id: sound_min_adc
    unit_of_measurement: adc
    accuracy_decimals: 0
    state_class: measurement
    filters:
      - throttle: 1s
    update_interval: never

  - platform: template
    name: Sound Max ADC
    id: sound_max_adc
    unit_of_measurement: adc
    accuracy_decimals: 0
    state_class: measurement
    filters:
      - throttle: 1s
    update_interval: never

  - platform: template
    name: Sound Level %
    id: sound_level_percent
    unit_of_measurement: "%"
    accuracy_decimals: 1
    icon: mdi:volume-high
    state_class: measurement
    update_interval: 1s
    lambda: |-
      const float peak = id(sound_peak_adc).state;
      const float floor_adc = id(sound_level_floor_adc).state;
      const float ceiling_adc = id(sound_level_ceiling_adc).state;
      if (isnan(peak) || isnan(floor_adc) || isnan(ceiling_adc) || ceiling_adc <= floor_adc) {
        return NAN;
      }

      float percent = ((peak - floor_adc) / (ceiling_adc - floor_adc)) * 100.0f;
      if (percent < 0.0f) percent = 0.0f;
      if (percent > 100.0f) percent = 100.0f;
      return percent;

  - platform: template
    name: Sound Approx dB
    id: sound_approx_db
    unit_of_measurement: dB
    accuracy_decimals: 1
    icon: mdi:waveform
    state_class: measurement
    update_interval: 1s
    lambda: |-
      const float percent = id(sound_level_percent).state;
      const float db_floor = id(sound_db_floor).state;
      const float db_ceiling = id(sound_db_ceiling).state;
      if (isnan(percent) || isnan(db_floor) || isnan(db_ceiling) || db_ceiling <= db_floor) {
        return NAN;
      }
      return db_floor + ((db_ceiling - db_floor) * (percent / 100.0f));

binary_sensor:
  - platform: gpio
    id: pir_raw
    internal: true
    pin:
      number: 27
      mode: INPUT
    on_state:
      then:
        - lambda: |-
            const uint32_t now = millis();
            if (x) {
              if (id(pir_high_since_ms) == 0) {
                id(pir_high_since_ms) = now;
              }
              id(pir_low_since_ms) = 0;
            } else {
              if (id(pir_low_since_ms) == 0) {
                id(pir_low_since_ms) = now;
              }
              id(pir_high_since_ms) = 0;
            }

  - platform: template
    name: Motion
    id: pir_motion
    device_class: motion

  - platform: gpio
    name: Door
    device_class: door
    pin:
      number: 32
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms

  - platform: template
    name: Sound Intrusion
    id: sound_intrusion
    device_class: sound

  - platform: status
    name: Status

text_sensor:
  - platform: template
    name: Comfort Level
    icon: mdi:emoticon-outline
    update_interval: 30s
    lambda: |-
      const float index = id(comfort_index).state;
      if (isnan(index)) {
        return {};
      }
      if (index >= 85.0f) return {"Excellent"};
      if (index >= 70.0f) return {"Good"};
      if (index >= 50.0f) return {"Fair"};
      if (index >= 30.0f) return {"Poor"};
      return {"Critical"};

  - platform: template
    name: Air Quality
    icon: mdi:leaf
    update_interval: 30s
    lambda: |-
      const float score = id(iaq_score).state;
      if (isnan(score)) {
        return {};
      }
      if (score >= 85.0f) return {"Excellent"};
      if (score >= 70.0f) return {"Good"};
      if (score >= 50.0f) return {"Moderate"};
      if (score >= 30.0f) return {"Poor"};
      return {"Hazardous"};

  - platform: wifi_info
    ip_address:
      name: IP Address
    ssid:
      name: WiFi SSID

button:
  - platform: restart
    name: Restart

interval:
  - interval: 50ms
    then:
      - lambda: |-
          const uint32_t now = millis();

          if (!id(pir_enabled)) {
            if (id(pir_motion_state)) {
              id(pir_motion_state) = false;
              id(pir_motion).publish_state(false);
            }
            return;
          }

          const bool raw = id(pir_raw).state;

          if (now < id(pir_warmup_until_ms)) {
            if (id(pir_motion_state)) {
              id(pir_motion_state) = false;
              id(pir_motion).publish_state(false);
            }
            return;
          }

          if (raw) {
            if (!id(pir_motion_state)) {
              const uint32_t detect_ms = (uint32_t) id(pir_detect_stable_ms).state;
              if (id(pir_high_since_ms) != 0 && (now - id(pir_high_since_ms)) >= detect_ms) {
                id(pir_motion_state) = true;
                id(pir_hold_until_ms) = now + (uint32_t) id(pir_hold_ms).state;
                id(pir_motion).publish_state(true);
              }
            } else {
              id(pir_hold_until_ms) = now + (uint32_t) id(pir_hold_ms).state;
            }
          } else if (id(pir_motion_state)) {
            const uint32_t clear_ms = (uint32_t) id(pir_clear_stable_ms).state;
            const bool low_stable = id(pir_low_since_ms) != 0 && (now - id(pir_low_since_ms)) >= clear_ms;
            const bool hold_expired = now >= id(pir_hold_until_ms);
            if (low_stable && hold_expired) {
              id(pir_motion_state) = false;
              id(pir_motion).publish_state(false);
            }
          }

  - interval: 10ms
    then:
      - lambda: |-
          if (!id(sound_enabled)) {
            return;
          }

          const uint32_t now = millis();
          const int sample = analogRead(34);

          if (id(sound_window_start_ms) == 0) {
            id(sound_window_start_ms) = now;
            id(sound_min_sample) = sample;
            id(sound_max_sample) = sample;
          }

          if (sample < id(sound_min_sample)) {
            id(sound_min_sample) = sample;
          }
          if (sample > id(sound_max_sample)) {
            id(sound_max_sample) = sample;
          }

          const uint32_t window_ms = (uint32_t) id(sound_sample_window_ms).state;
          if ((now - id(sound_window_start_ms)) < window_ms) {
            return;
          }

          const int peak = id(sound_max_sample) - id(sound_min_sample);
          id(sound_peak_to_peak_adc_raw) = peak;
          id(sound_peak_adc).publish_state(peak);
          id(sound_min_adc).publish_state(id(sound_min_sample));
          id(sound_max_adc).publish_state(id(sound_max_sample));

          if (peak >= (int) id(sound_threshold_adc).state) {
            id(sound_hold_until_ms) = now + (uint32_t) id(sound_hold_ms).state;
            if (!id(sound_intrusion_state)) {
              id(sound_intrusion_state) = true;
              id(sound_intrusion).publish_state(true);
            }
          } else if (id(sound_intrusion_state) && now >= id(sound_hold_until_ms)) {
            id(sound_intrusion_state) = false;
            id(sound_intrusion).publish_state(false);
          }

          id(sound_window_start_ms) = now;
          id(sound_min_sample) = sample;
          id(sound_max_sample) = sample;