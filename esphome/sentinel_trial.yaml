  - platform: gpio
    name: Door
    device_class: door
    pin:
      number: 32
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms

  - platform: template
    name: Sound Intrusion
    id: sound_intrusion
    device_class: sound

  - platform: template
    name: Smoke Alarm Detected
    id: smoke_alarm_detected
    device_class: sound

