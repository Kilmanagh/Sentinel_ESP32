text_sensor:
  - platform: debug
    reset_reason:
      name: Reset Reason
      id: reset_reason_text
      entity_category: diagnostic

  - platform: template
    name: Device Health
    id: device_health
    icon: mdi:heart-pulse
    entity_category: diagnostic
    update_interval: 15s
    lambda: |-
      if (id(system_uptime_s).state < 60.0f) {
        return {"Recovering After Boot"};
      }

      if (!id(wifi_connected_state)) {
        return {"WiFi Reconnecting"};
      }

      if (id(api_client_count) <= 0) {
        return {"WiFi OK / API Idle"};
      }

      if (isnan(id(bme_temperature_f).state) || isnan(id(bme_humidity).state) || isnan(id(bme_pressure_hpa).state)) {
        return {"Sensor Trouble"};
      }

      if (!isnan(id(heap_free_bytes).state) && id(heap_free_bytes).state < 20000.0f) {
        return {"Low Memory"};
      }

      if (!isnan(id(heap_fragmentation_pct).state) && id(heap_fragmentation_pct).state > 50.0f) {
        return {"Memory Fragmented"};
      }

      return {"Healthy"};

  - platform: template
    name: Sound Calibration Status
    icon: mdi:tune
    update_interval: 1s
    lambda: |-
      if (id(sound_calibration_mode) == 1) {
        return {"Capturing Quiet Baseline"};
      }
      if (id(sound_calibration_mode) == 2) {
        return {"Capturing Loud Reference"};
      }
      return {"Idle"};

  - platform: template
    name: Comfort Level
    icon: mdi:emoticon-outline
    update_interval: 30s
    lambda: |-
      const float index = id(comfort_index).state;
      if (isnan(index)) {
        return {};
      }
      if (index >= 85.0f) return {"Excellent"};
      if (index >= 70.0f) return {"Good"};
      if (index >= 50.0f) return {"Fair"};
      if (index >= 30.0f) return {"Poor"};
      return {"Critical"};

  - platform: template
    name: Air Quality
