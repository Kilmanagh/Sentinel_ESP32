select:
  - platform: template
    name: Smoke Alarm Profile
    id: smoke_alarm_profile
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: Default
    options:
      - Default
      - Generic Smoke
      - Strict T3 Smoke
      - Strict T4 CO
      - Low Battery Chirp
      - Custom

switch:
  - platform: template
    name: Enable Status Pixel Auto
    id: status_pixel_auto_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          id(status_pixel_auto_enabled) = true;
    turn_off_action:
      - lambda: |-
          id(status_pixel_auto_enabled) = false;

  - platform: template
    name: Enable PIR Sensing
    id: pir_enable_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          id(pir_enabled) = true;
          id(pir_warmup_until_ms) = millis() + (uint32_t) id(pir_warmup_ms).state;
    turn_off_action:
      - lambda: |-
          id(pir_enabled) = false;
          id(pir_motion_state) = false;
          id(pir_high_since_ms) = 0;
          id(pir_low_since_ms) = 0;
          id(pir_hold_until_ms) = 0;
          id(pir_motion).publish_state(false);

  - platform: template
    name: Enable Sound Sensing
    id: sound_enable_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          id(sound_enabled) = true;
          id(sound_window_start_ms) = 0;
    turn_off_action:
      - lambda: |-
          id(sound_enabled) = false;
          id(sound_intrusion_state) = false;
          id(sound_calibration_mode) = 0;
          id(sound_calibration_until_ms) = 0;
          id(sound_calibration_peak) = 0;
          id(sound_window_start_ms) = 0;
          id(sound_hold_until_ms) = 0;
          id(sound_peak_to_peak_adc_raw) = 0;
          id(sound_intrusion).publish_state(false);
          id(sound_peak_adc).publish_state(0);
          id(sound_min_adc).publish_state(0);
          id(sound_max_adc).publish_state(0);
          id(smoke_alarm_state) = false;
          id(smoke_alarm_tone_active) = false;
          id(smoke_alarm_last_beep_ms) = 0;
          id(smoke_alarm_hold_until_ms) = 0;
          id(smoke_alarm_beep_count) = 0;
          id(smoke_alarm_detected).publish_state(false);
          id(smoke_alarm_tone_score).publish_state(0);

  - platform: template
    name: Enable Smoke Alarm Sensing
    id: smoke_alarm_enable_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: |-
          id(smoke_alarm_enabled) = true;
          id(smoke_alarm_state) = false;
          id(smoke_alarm_tone_active) = false;
          id(smoke_alarm_last_beep_ms) = 0;
          id(smoke_alarm_hold_until_ms) = 0;
          id(smoke_alarm_beep_count) = 0;
          id(smoke_alarm_detected).publish_state(false);
          id(smoke_alarm_tone_score).publish_state(0);
    turn_off_action:
      - lambda: |-
          id(smoke_alarm_enabled) = false;
          id(smoke_alarm_state) = false;
          id(smoke_alarm_tone_active) = false;
          id(smoke_alarm_last_beep_ms) = 0;
          id(smoke_alarm_hold_until_ms) = 0;
          id(smoke_alarm_beep_count) = 0;
          id(smoke_alarm_detected).publish_state(false);
          id(smoke_alarm_tone_score).publish_state(0);

sensor:
  - platform: bme280_i2c
    address: 0x76
    update_interval: 30s
    temperature:
      name: Temperature
      id: bme_temperature_f
      unit_of_measurement: "°F"
      device_class: temperature
      state_class: measurement
      filters:
        - lambda: return x * 9.0f / 5.0f + 32.0f;
    pressure:
      name: Pressure
      id: bme_pressure_hpa
      unit_of_measurement: hPa
      device_class: atmospheric_pressure
      state_class: measurement
    humidity:
      name: Humidity
      id: bme_humidity
      device_class: humidity
      state_class: measurement

  - platform: template
    name: Comfort Index
    id: comfort_index
    icon: mdi:thermometer-check
    accuracy_decimals: 1
    state_class: measurement
    update_interval: 30s
    lambda: |-
      const float temp_f = id(bme_temperature_f).state;
      const float humidity = id(bme_humidity).state;
      if (isnan(temp_f) || isnan(humidity)) {
        return NAN;
      }

      float temp_score;
      if (temp_f >= 70.0f && temp_f <= 76.0f) {
        temp_score = 100.0f;
      } else if (temp_f < 70.0f) {
        temp_score = std::max(0.0f, 100.0f - (70.0f - temp_f) * 5.0f);
      } else {
        temp_score = std::max(0.0f, 100.0f - (temp_f - 76.0f) * 5.0f);
      }

      float humidity_score;
      if (humidity >= 35.0f && humidity <= 55.0f) {
        humidity_score = 100.0f;
      } else if (humidity < 35.0f) {
        humidity_score = std::max(0.0f, 100.0f - (35.0f - humidity) * 3.0f);
      } else {
        humidity_score = std::max(0.0f, 100.0f - (humidity - 55.0f) * 3.0f);
      }

      return (temp_score * 0.6f) + (humidity_score * 0.4f);

  - platform: template
    name: IAQ Score
    id: iaq_score
    icon: mdi:air-filter
    accuracy_decimals: 0
    state_class: measurement
    update_interval: 30s
    lambda: |-
      const float humidity = id(bme_humidity).state;
      const float pressure_hpa = id(bme_pressure_hpa).state;
      if (isnan(humidity) || isnan(pressure_hpa)) {
        return NAN;
      }

      int humidity_score;
      if (humidity >= 40.0f && humidity <= 60.0f) {
        humidity_score = 100;
      } else if (humidity < 40.0f) {
        humidity_score = std::max(0, (int) (100.0f - (40.0f - humidity) * 3.0f));
      } else {
        humidity_score = std::max(0, (int) (100.0f - (humidity - 60.0f) * 3.5f));
      }

      int pressure_score;
      if (pressure_hpa >= 1005.0f && pressure_hpa <= 1025.0f) {
        pressure_score = 100;
      } else if (pressure_hpa < 1005.0f) {
        pressure_score = std::max(0, (int) (100.0f - (1005.0f - pressure_hpa) * 2.0f));
      } else {
        pressure_score = std::max(0, (int) (100.0f - (pressure_hpa - 1025.0f) * 2.0f));
      }

      return (float) ((humidity_score * 70 + pressure_score * 30) / 100);

  - platform: wifi_signal
    name: WiFi RSSI
    id: wifi_rssi_db
    update_interval: 60s

  - platform: uptime
    name: Uptime
    id: system_uptime_s
    update_interval: 60s

  - platform: debug
    free:
      name: Heap Free
      id: heap_free_bytes
      unit_of_measurement: B
      entity_category: diagnostic
    min_free:
      name: Heap Min Free
      id: heap_min_free_bytes
      unit_of_measurement: B
      entity_category: diagnostic
    fragmentation:
      name: Heap Fragmentation
      id: heap_fragmentation_pct
      unit_of_measurement: "%"
      entity_category: diagnostic
    loop_time:
      name: Main Loop Time
      id: main_loop_time_ms
      unit_of_measurement: ms
      entity_category: diagnostic

  - platform: template
    name: Boot Count
    id: boot_count_sensor
    accuracy_decimals: 0
    icon: mdi:counter
    state_class: measurement
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      return (float) id(boot_count);

  - platform: template
    name: WiFi Disconnect Count
    id: wifi_disconnect_count_sensor
    accuracy_decimals: 0
    icon: mdi:wifi-alert
    state_class: measurement
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      return (float) id(wifi_disconnect_count);

  - platform: template
    name: API Disconnect Count
    id: api_disconnect_count_sensor
    accuracy_decimals: 0
    icon: mdi:lan-disconnect
    state_class: measurement
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      return (float) id(api_disconnect_count);

  - platform: template
    name: Sound Peak ADC
    id: sound_peak_adc
    unit_of_measurement: adc
    accuracy_decimals: 0
    state_class: measurement
    filters:
      - throttle: 1s
    update_interval: never

  - platform: template
    name: Sound Min ADC
    id: sound_min_adc
    unit_of_measurement: adc
    accuracy_decimals: 0
    state_class: measurement
    filters:
      - throttle: 1s
    update_interval: never

  - platform: template
    name: Sound Max ADC
    id: sound_max_adc
    unit_of_measurement: adc
    accuracy_decimals: 0
    state_class: measurement
    filters:
      - throttle: 1s
    update_interval: never

  - platform: template
    name: Sound Level %
    id: sound_level_percent
    unit_of_measurement: "%"
    accuracy_decimals: 1
    icon: mdi:volume-high
    state_class: measurement
    update_interval: 1s
    lambda: |-
      const float peak = id(sound_peak_adc).state;
      const float floor_adc = id(sound_level_floor_adc).state;
      const float ceiling_adc = id(sound_level_ceiling_adc).state;
      if (isnan(peak) || isnan(floor_adc) || isnan(ceiling_adc) || ceiling_adc <= floor_adc) {
        return NAN;
      }

      float percent = ((peak - floor_adc) / (ceiling_adc - floor_adc)) * 100.0f;
      if (percent < 0.0f) percent = 0.0f;
      if (percent > 100.0f) percent = 100.0f;
      return percent;

  - platform: template
    name: Sound Approx dB
    id: sound_approx_db
    unit_of_measurement: dB
    accuracy_decimals: 1
    icon: mdi:waveform
    state_class: measurement
    update_interval: 1s
    lambda: |-
      const float percent = id(sound_level_percent).state;
      const float db_floor = id(sound_db_floor).state;
      const float db_ceiling = id(sound_db_ceiling).state;
      if (isnan(percent) || isnan(db_floor) || isnan(db_ceiling) || db_ceiling <= db_floor) {
        return NAN;
      }
      return db_floor + ((db_ceiling - db_floor) * (percent / 100.0f));

  - platform: template
    name: Smoke Alarm Tone Score
    id: smoke_alarm_tone_score
    unit_of_measurement: "%"
    accuracy_decimals: 1
    icon: mdi:sine-wave
    state_class: measurement
    update_interval: never

  - platform: template
    name: Sound Calibration Captured Peak
    id: sound_calibration_captured_peak
    unit_of_measurement: adc
    accuracy_decimals: 0
    icon: mdi:tune-vertical
    state_class: measurement
    update_interval: 1s
    lambda: |-
      return (float) id(sound_calibration_peak);

  - platform: template
    name: Smoke Alarm Beep Count
    id: smoke_alarm_beep_count_sensor
    icon: mdi:counter
    accuracy_decimals: 0
    state_class: measurement
    update_interval: 1s
    lambda: |-
      return (float) id(smoke_alarm_beep_count);

  - platform: template
    name: Smoke Alarm Last Beep Age
    id: smoke_alarm_last_beep_age_ms
    unit_of_measurement: ms
    icon: mdi:timer-outline
    accuracy_decimals: 0
    state_class: measurement
    update_interval: 1s
    lambda: |-
      if (id(smoke_alarm_last_beep_ms) == 0) {
        return 0.0f;
      }
      return (float) (millis() - id(smoke_alarm_last_beep_ms));

light:
