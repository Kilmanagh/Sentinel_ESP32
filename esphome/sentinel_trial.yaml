# ESPHome port of the Sentinel node.
#
# Keeps what ESPHome is good at:
# - Wi-Fi + native API/Home Assistant integration
# - BME280 environment telemetry
# - PIR motion, reed switch door, and MAX9814 sound detection
# - Runtime tuning through Home Assistant number entities
#

substitutions:
  device_name: sentinel
  friendly_name: Sentinel
  fallback_ap_password: change-me-1234
  status_pixel_pin: "25"
  status_pixel_rgb_order: GRB

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: Sentinel ESP32 node
  project:
    name: sentinel.node
    version: "0.1"
  on_boot:
    priority: -100
    then:
      - script.execute: reset_runtime_states
      - lambda: |-
          id(boot_count) += 1;
          id(wifi_connected_state) = false;
          id(api_client_count) = 0;
          id(pir_warmup_until_ms) = millis() + (uint32_t) id(pir_warmup_ms).state;
      - binary_sensor.template.publish:
          id: wifi_connected
          state: false
      - binary_sensor.template.publish:
          id: api_connected
          state: false

esp32:
  board: esp32dev
  framework:
    type: arduino

preferences:
  flash_write_interval: 1min

logger:
  level: INFO

api:
  on_client_connected:
    then:
      - lambda: |-
          id(api_client_count) += 1;
      - binary_sensor.template.publish:
          id: api_connected
          state: true
  on_client_disconnected:
    then:
      - lambda: |-
          if (id(api_client_count) > 0) {
            id(api_client_count) -= 1;
          }
          id(api_disconnect_count) += 1;
          id(api_connected).publish_state(id(api_client_count) > 0);

ota:
  - platform: esphome

debug:
  update_interval: 30s

web_server:
  port: 80
  version: 3
  include_internal: false

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    then:
      - lambda: |-
          id(wifi_connected_state) = true;
      - binary_sensor.template.publish:
          id: wifi_connected
          state: true
  on_disconnect:
    then:
      - lambda: |-
          id(wifi_connected_state) = false;
          id(wifi_disconnect_count) += 1;
      - binary_sensor.template.publish:
          id: wifi_connected
          state: false
  # Uncomment and edit if you want a fixed LAN address.
  # manual_ip:
  #   static_ip: 192.168.1.50
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0
  #   dns1: 192.168.1.1
  #   dns2: 1.1.1.1
  ap:
    ssid: ${friendly_name} Fallback
    password: ${fallback_ap_password}

captive_portal:

status_led:
  pin:
    number: 2

i2c:
  sda: 21
  scl: 22
  scan: true

globals:
