            static int state = 0;
            auto call = id(status_pixel).turn_on();
            call.set_transition_length(150);
            call.set_brightness(0.25f);
            if (state == 0) {
              call.set_rgb(0.0f, 1.0f, 0.0f);
            } else if (state == 1) {
              call.set_rgb(1.0f, 0.7f, 0.15f);
            } else if (state == 2) {
              call.set_rgb(0.0f, 1.0f, 1.0f);
            } else if (state == 3) {
              call.set_rgb(0.0f, 0.0f, 1.0f);
            } else if (state == 4) {
              call.set_rgb(1.0f, 0.35f, 0.0f);
            } else if (state == 5) {
              call.set_rgb(1.0f, 1.0f, 0.0f);
            } else if (state == 6) {
              call.set_rgb(1.0f, 0.0f, 1.0f);
            } else {
              call.set_rgb(1.0f, 0.0f, 0.0f);
            }
            call.perform();
            state = (state + 1) % 8;

binary_sensor:
