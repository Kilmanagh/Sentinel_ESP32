    update_interval: 30s
    lambda: |-
      const float score = id(iaq_score).state;
      if (isnan(score)) {
        return {};
      }
      if (score >= 85.0f) return {"Excellent"};
      if (score >= 70.0f) return {"Good"};
      if (score >= 50.0f) return {"Moderate"};
      if (score >= 30.0f) return {"Poor"};
      return {"Hazardous"};

  - platform: wifi_info
    ip_address:
      name: IP Address
    ssid:
      name: WiFi SSID

button:
  - platform: template
    name: Capture Quiet Baseline
    on_press:
      then:
        - lambda: |-
            id(sound_calibration_mode) = 1;
            id(sound_calibration_until_ms) = millis() + (uint32_t) id(sound_calibration_capture_ms).state;
            id(sound_calibration_peak) = 0;

  - platform: template
    name: Capture Loud Reference
    on_press:
      then:
        - lambda: |-
            id(sound_calibration_mode) = 2;
            id(sound_calibration_until_ms) = millis() + (uint32_t) id(sound_calibration_capture_ms).state;
            id(sound_calibration_peak) = 0;

  - platform: template
    name: Reset Detection State
    on_press:
      then:
        - script.execute: reset_runtime_states
        - lambda: |-
            id(pir_warmup_until_ms) = millis() + (uint32_t) id(pir_warmup_ms).state;

  - platform: restart
    name: Restart

interval:
  - interval: 50ms
    then:
      - lambda: |-
          const uint32_t now = millis();

          if (!id(pir_enabled)) {
            if (id(pir_motion_state)) {
              id(pir_motion_state) = false;
              id(pir_motion).publish_state(false);
            }
            return;
          }

          const bool raw = id(pir_raw).state;

          if (now < id(pir_warmup_until_ms)) {
            if (id(pir_motion_state)) {
              id(pir_motion_state) = false;
              id(pir_motion).publish_state(false);
            }
            return;
          }

          if (raw) {
            if (!id(pir_motion_state)) {
              const uint32_t detect_ms = (uint32_t) id(pir_detect_stable_ms).state;
              if (id(pir_high_since_ms) != 0 && (now - id(pir_high_since_ms)) >= detect_ms) {
                id(pir_motion_state) = true;
                id(pir_hold_until_ms) = now + (uint32_t) id(pir_hold_ms).state;
                id(pir_motion).publish_state(true);
              }
            } else {
              id(pir_hold_until_ms) = now + (uint32_t) id(pir_hold_ms).state;
            }
          } else if (id(pir_motion_state)) {
            const uint32_t clear_ms = (uint32_t) id(pir_clear_stable_ms).state;
            const bool low_stable = id(pir_low_since_ms) != 0 && (now - id(pir_low_since_ms)) >= clear_ms;
            const bool hold_expired = now >= id(pir_hold_until_ms);
            if (low_stable && hold_expired) {
              id(pir_motion_state) = false;
              id(pir_motion).publish_state(false);
            }
          }

  - interval: 250ms
    then:
      - lambda: |-
          id(status_pixel_step) += 1;

          if (!id(status_pixel_auto_enabled)) {
            return;
          }

          const uint32_t now = millis();
          float red = 0.0f;
          float green = 0.0f;
          float blue = 0.0f;
          float brightness = 0.08f;
          bool light_on = true;

          if (id(smoke_alarm_state) || id(smoke_alarm_detected).state) {
            red = 1.0f;
            brightness = 0.65f;
            light_on = (id(status_pixel_step) % 2) == 0;
          } else if (id(sound_intrusion_state) || id(sound_intrusion).state) {
            red = 1.0f;
            green = 0.35f;
            brightness = (id(status_pixel_step) % 2) == 0 ? 0.35f : 0.10f;
          } else if (id(sound_calibration_mode) == 1) {
            green = 0.85f;
            blue = 0.85f;
            brightness = (id(status_pixel_step) % 2) == 0 ? 0.30f : 0.08f;
          } else if (id(sound_calibration_mode) == 2) {
            red = 1.0f;
            green = 0.85f;
            brightness = (id(status_pixel_step) % 2) == 0 ? 0.35f : 0.08f;
          } else if (id(pir_motion_state) || id(pir_motion).state) {
            blue = 1.0f;
            brightness = (id(status_pixel_step) % 2) == 0 ? 0.25f : 0.08f;
          } else if (id(node_status).state == false) {
            red = 1.0f;
            green = 0.2f;
            brightness = (id(status_pixel_step) % 2) == 0 ? 0.30f : 0.0f;
          } else if (!id(wifi_connected_state)) {
            red = 1.0f;
            green = 0.55f;
            brightness = (id(status_pixel_step) % 4) < 2 ? 0.22f : 0.0f;
          } else if (id(api_client_count) <= 0) {
            green = 0.7f;
            blue = 0.7f;
            brightness = (id(status_pixel_step) % 4) == 0 ? 0.18f : 0.03f;
          } else if (now < id(pir_warmup_until_ms) || id(system_uptime_s).state < 60.0f) {
            red = 1.0f;
            green = 0.7f;
            blue = 0.15f;
            brightness = (id(status_pixel_step) % 4) < 2 ? 0.18f : 0.05f;
          } else if (id(device_health).state == "Low Memory" || id(device_health).state == "Memory Fragmented") {
            red = 1.0f;
            green = 0.0f;
            blue = 1.0f;
            brightness = (id(status_pixel_step) % 2) == 0 ? 0.18f : 0.04f;
          } else if (id(device_health).state == "Sensor Trouble") {
            red = 1.0f;
            green = 1.0f;
            brightness = (id(status_pixel_step) % 2) == 0 ? 0.18f : 0.03f;
          } else {
            green = 1.0f;
            brightness = 0.07f;
          }

          auto call = id(status_pixel).make_call();
          if (!light_on || brightness <= 0.0f) {
            call.set_state(false);
          } else {
            call.set_state(true);
            call.set_brightness(brightness);
            call.set_rgb(red, green, blue);
          }
          call.perform();

  - interval: 10ms
    then:
      - lambda: |-
          if (!id(sound_enabled)) {
            return;
          }

          const uint32_t now = millis();
          const int sample = analogRead(34);

          if (id(sound_window_start_ms) == 0) {
            id(sound_window_start_ms) = now;
            id(sound_min_sample) = sample;
            id(sound_max_sample) = sample;
          }

          if (sample < id(sound_min_sample)) {
            id(sound_min_sample) = sample;
          }
          if (sample > id(sound_max_sample)) {
            id(sound_max_sample) = sample;
          }

          const uint32_t window_ms = (uint32_t) id(sound_sample_window_ms).state;
          if ((now - id(sound_window_start_ms)) < window_ms) {
            return;
          }

          const int peak = id(sound_max_sample) - id(sound_min_sample);
          id(sound_peak_to_peak_adc_raw) = peak;
          id(sound_peak_adc).publish_state(peak);
          id(sound_min_adc).publish_state(id(sound_min_sample));
          id(sound_max_adc).publish_state(id(sound_max_sample));

          if (id(sound_calibration_mode) != 0) {
            if (peak > id(sound_calibration_peak)) {
              id(sound_calibration_peak) = peak;
            }

            if (now >= id(sound_calibration_until_ms)) {
              const int captured_peak = id(sound_calibration_peak);

              if (id(sound_calibration_mode) == 1) {
                float new_floor = (float) captured_peak;
                const float ceiling = id(sound_level_ceiling_adc).state;
                if (!isnan(ceiling) && new_floor >= ceiling) {
                  new_floor = std::max(0.0f, ceiling - 1.0f);
                }

                auto call = id(sound_level_floor_adc).make_call();
                call.set_value(new_floor);
                call.perform();
              } else if (id(sound_calibration_mode) == 2) {
                float new_ceiling = (float) captured_peak;
                const float floor = id(sound_level_floor_adc).state;
                if (!isnan(floor) && new_ceiling <= floor) {
                  new_ceiling = floor + 1.0f;
                }

                auto call = id(sound_level_ceiling_adc).make_call();
                call.set_value(new_ceiling);
                call.perform();
              }

              id(sound_calibration_mode) = 0;
              id(sound_calibration_until_ms) = 0;
            }
          }

          if (peak >= (int) id(sound_threshold_adc).state) {
            id(sound_hold_until_ms) = now + (uint32_t) id(sound_hold_ms).state;
            if (!id(sound_intrusion_state)) {
              id(sound_intrusion_state) = true;
              id(sound_intrusion).publish_state(true);
            }
          } else if (id(sound_intrusion_state) && now >= id(sound_hold_until_ms)) {
            id(sound_intrusion_state) = false;
            id(sound_intrusion).publish_state(false);
          }

          if (id(smoke_alarm_enabled)) {
            constexpr int smoke_sample_count = 64;
            constexpr int smoke_sample_interval_us = 125;
            constexpr float smoke_sample_rate_hz = 8000.0f;

            std::string smoke_profile = id(smoke_alarm_profile).current_option().c_str();
            if (smoke_profile.empty()) {
              smoke_profile = "Default";
            }
            float smoke_target_freqs[3] = {3000.0f, 3200.0f, 3400.0f};
            float smoke_tone_threshold = id(smoke_alarm_tone_threshold_pct).state;
            int smoke_min_peak = (int) id(smoke_alarm_min_peak_adc).state;
            uint32_t smoke_confirm_beeps = (uint32_t) id(smoke_alarm_confirm_beeps).state;
            uint32_t smoke_hold_ms = (uint32_t) id(smoke_alarm_hold_ms_config).state;
            uint32_t smoke_min_beep_gap_ms = 250;
            uint32_t smoke_max_beep_gap_ms = 2000;

            if (smoke_profile == "Generic Smoke") {
              smoke_target_freqs[0] = 2800.0f;
              smoke_target_freqs[1] = 3100.0f;
              smoke_target_freqs[2] = 3400.0f;
              smoke_tone_threshold = 16.0f;
              smoke_min_peak = 220;
              smoke_confirm_beeps = 3;
              smoke_hold_ms = 15000;
              smoke_min_beep_gap_ms = 250;
              smoke_max_beep_gap_ms = 1800;
            } else if (smoke_profile == "Strict T3 Smoke") {
              smoke_target_freqs[0] = 3000.0f;
              smoke_target_freqs[1] = 3200.0f;
              smoke_target_freqs[2] = 3400.0f;
              smoke_tone_threshold = 18.0f;
              smoke_min_peak = 250;
              smoke_confirm_beeps = 3;
              smoke_hold_ms = 15000;
              smoke_min_beep_gap_ms = 700;
              smoke_max_beep_gap_ms = 2200;
            } else if (smoke_profile == "Strict T4 CO") {
              smoke_target_freqs[0] = 2600.0f;
              smoke_target_freqs[1] = 2900.0f;
              smoke_target_freqs[2] = 3200.0f;
              smoke_tone_threshold = 20.0f;
              smoke_min_peak = 260;
              smoke_confirm_beeps = 4;
              smoke_hold_ms = 15000;
              smoke_min_beep_gap_ms = 350;
              smoke_max_beep_gap_ms = 1500;
            } else if (smoke_profile == "Low Battery Chirp") {
              smoke_target_freqs[0] = 3000.0f;
              smoke_target_freqs[1] = 3200.0f;
              smoke_target_freqs[2] = 3400.0f;
              smoke_tone_threshold = 22.0f;
              smoke_min_peak = 180;
              smoke_confirm_beeps = 1;
              smoke_hold_ms = 6000;
              smoke_min_beep_gap_ms = 10000;
              smoke_max_beep_gap_ms = 90000;
            } else if (smoke_profile == "Custom") {
              smoke_target_freqs[0] = id(smoke_alarm_custom_tone_1_hz).state;
              smoke_target_freqs[1] = id(smoke_alarm_custom_tone_2_hz).state;
              smoke_target_freqs[2] = id(smoke_alarm_custom_tone_3_hz).state;
              smoke_min_beep_gap_ms = (uint32_t) id(smoke_alarm_custom_min_beep_gap_ms).state;
              smoke_max_beep_gap_ms = (uint32_t) id(smoke_alarm_custom_max_beep_gap_ms).state;
              if (smoke_max_beep_gap_ms < smoke_min_beep_gap_ms) {
                smoke_max_beep_gap_ms = smoke_min_beep_gap_ms;
              }
            }

            int smoke_samples[smoke_sample_count];
            int32_t smoke_sum = 0;
            for (int index = 0; index < smoke_sample_count; index++) {
              const int raw_sample = analogRead(34);
              smoke_samples[index] = raw_sample;
              smoke_sum += raw_sample;
              delayMicroseconds(smoke_sample_interval_us);
            }

            const float smoke_mean = (float) smoke_sum / smoke_sample_count;
            float smoke_energy = 0.0f;
            for (int index = 0; index < smoke_sample_count; index++) {
              const float centered = smoke_samples[index] - smoke_mean;
              smoke_energy += centered * centered;
            }

            float smoke_best_power = 0.0f;
            for (float target_freq : smoke_target_freqs) {
              const float omega = 2.0f * 3.14159265f * target_freq / smoke_sample_rate_hz;
              const float coeff = 2.0f * cosf(omega);
              float q0 = 0.0f;
              float q1 = 0.0f;
              float q2 = 0.0f;

              for (int index = 0; index < smoke_sample_count; index++) {
                const float centered = smoke_samples[index] - smoke_mean;
                q0 = coeff * q1 - q2 + centered;
                q2 = q1;
                q1 = q0;
              }

              const float power = q1 * q1 + q2 * q2 - coeff * q1 * q2;
              if (power > smoke_best_power) {
                smoke_best_power = power;
              }
            }

            float smoke_tone_score = 0.0f;
            if (smoke_energy > 1.0f) {
              smoke_tone_score = (smoke_best_power / (smoke_energy * smoke_sample_count)) * 100.0f;
              if (smoke_tone_score < 0.0f) smoke_tone_score = 0.0f;
              if (smoke_tone_score > 100.0f) smoke_tone_score = 100.0f;
            }
            id(smoke_alarm_tone_score).publish_state(smoke_tone_score);

            const bool tone_detected = peak >= smoke_min_peak &&
                                       smoke_tone_score >= smoke_tone_threshold;

            if (tone_detected) {
              if (!id(smoke_alarm_tone_active)) {
                const uint32_t since_last_beep = id(smoke_alarm_last_beep_ms) == 0 ? 0 : now - id(smoke_alarm_last_beep_ms);
                if (id(smoke_alarm_last_beep_ms) == 0 || since_last_beep > smoke_max_beep_gap_ms) {
                  id(smoke_alarm_beep_count) = 1;
                } else if (since_last_beep >= smoke_min_beep_gap_ms) {
                  id(smoke_alarm_beep_count) += 1;
                }

                id(smoke_alarm_last_beep_ms) = now;
                id(smoke_alarm_tone_active) = true;

                if (id(smoke_alarm_beep_count) >= (int) smoke_confirm_beeps) {
                  id(smoke_alarm_state) = true;
                  id(smoke_alarm_hold_until_ms) = now + smoke_hold_ms;
