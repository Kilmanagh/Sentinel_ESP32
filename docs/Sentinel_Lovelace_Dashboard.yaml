            name: Center LED Meaning
          - entity: text_sensor.sentinel_status_led_right_meaning
            name: Right LED Meaning
          - entity: sensor.sentinel_sound_peak_adc
            name: Sound Peak ADC
          - entity: sensor.sentinel_sound_level
            name: Sound Level %
          - entity: sensor.sentinel_sound_approx_db
            name: Sound Approx dB
          - entity: sensor.sentinel_smoke_alarm_tone_score
            name: Smoke Alarm Tone Score
          - entity: sensor.sentinel_smoke_alarm_beep_count
            name: Smoke Alarm Beep Count
          - entity: sensor.sentinel_smoke_alarm_last_beep_age
            name: Smoke Alarm Last Beep Age
          - entity: text_sensor.sentinel_sound_calibration_status
            name: Sound Calibration Status
          - entity: sensor.sentinel_sound_calibration_captured_peak
            name: Sound Calibration Captured Peak
      - type: entities
        title: Status LED Troubleshooting
        show_header_toggle: false
        entities:
