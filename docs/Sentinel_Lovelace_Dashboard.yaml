  - title: Troubleshooting
    path: sentinel-troubleshooting
    icon: mdi:stethoscope
    cards:
      - type: markdown
        title: Quick Checks
        content: >
          ## If sound detection is too sensitive


          - Raise `Sound Threshold ADC`

          - Raise `Sound Level Floor ADC` only if the percentage display is too
          high at rest

          - Leave `Sound Level Ceiling ADC` for loud-reference scaling, not
          detection


          ## If sound detection misses events


          - Lower `Sound Threshold ADC`

          - Shorten `Sound Sample Window` if you want faster transient capture

          - Re-run `Capture Loud Reference` if the loud baseline is outdated


          ## If smoke alarm detection false-triggers


          - Raise `Smoke Alarm Tone Threshold`

          - Raise `Smoke Alarm Min Peak ADC`

          - Raise `Smoke Alarm Confirm Beeps`


          ## If smoke alarm detection misses test tones


          - Lower `Smoke Alarm Tone Threshold`

          - Lower `Smoke Alarm Min Peak ADC`

          - Watch `Smoke Alarm Tone Score`, `Smoke Alarm Beep Count`, and `Smoke
          Alarm Last Beep Age`


          ## If the status LEDs do not look right


          - Confirm the chain is `LED 1 -> LED 2 -> LED 3`

          - If colors are wrong, change `status_pixel_rgb_order`

          - Turn off `Enable Status LEDs Auto` and run `Full Status Preview`

          - If all LEDs stay dark, check `5V`, shared `GND`, and the `GPIO25`
          data line
      - type: entities
        title: Troubleshooting Readouts
        show_header_toggle: false
        entities:
          - entity: sensor.sentinel_device_health
            name: Device Health
          - entity: text_sensor.sentinel_status_led_left_meaning
            name: Left LED Meaning
