            max: 95
            severity:
              green: 68
              yellow: 78
              red: 85
          - type: gauge
            entity: sensor.sentinel_humidity
            name: Humidity
            min: 0
            max: 100
            severity:
              green: 35
              yellow: 60
              red: 75
          - type: gauge
            entity: sensor.sentinel_iaq_score
            name: IAQ Score
            min: 0
            max: 100
