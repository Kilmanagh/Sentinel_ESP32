            name: PIR Sensing
            features_position: bottom
            vertical: false
          - type: tile
            entity: switch.sentinel_enable_sound_sensing
            name: Sound Sensing
            features_position: bottom
            vertical: false
          - type: tile
            entity: switch.sentinel_enable_smoke_alarm_sensing
            name: Smoke Alarm Sensing
            features_position: bottom
            vertical: false
          - type: tile
